"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true

format = """
[╭─◆ ](bold #C8A24A)$username$hostname$directory$git_branch$git_status$cmd_duration$nodejs$python$rust$golang
[╰─](bold #C8A24A)$character"""

[character]
success_symbol = "[❯](bold #C8A24A)"
error_symbol   = "[❯](bold #B0313A)"
vimcmd_symbol  = "[❮](bold #C8A24A)"

[username]
show_always = true
style_user = "bold #C8A24A"
style_root = "bold #B0313A"
format = "[$user]($style)"

[hostname]
ssh_only = false
style = "#A89F8C"
format = "[@$hostname]($style) "

[directory]
style = "fg:#F5F0E6 bg:#8B1E24"
read_only = " ×"
read_only_style = "fg:#F5F0E6 bg:#8B1E24"
truncation_length = 4
truncation_symbol = "…/"
format = "[](fg:#8B1E24)[ $path$read_only ](bold $style)[](fg:#8B1E24) "

[git_branch]
symbol = " "
style = "bold #C8A24A"
format = "[$symbol$branch]($style) "

[git_status]
style = "#B0313A"
format = "([$all_status$ahead_behind]($style)) "
conflicted = "✗"
ahead = "↑${count}"
behind = "↓${count}"
diverged = "↕↑${ahead_count}↓${behind_count}"
untracked = "?${count}"
modified = "●${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"
stashed = "≡"

[cmd_duration]
min_time = 2000
style = "#A89F8C"
format = "[took $duration]($style) "

[nodejs]
symbol = " "
style = "#6E7B3E"
format = "[$symbol($version )]($style)"

[python]
symbol = " "
style = "#6E7B3E"
format = "[$symbol($version )]($style)"

[rust]
symbol = " "
style = "#C8A24A"
format = "[$symbol($version )]($style)"

[golang]
symbol = " "
style = "#6E7B3E"
format = "[$symbol($version )]($style)"
